AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Alarms and dashboard
Parameters:
  bucketName:
    Type: String
    Description: The name of the S3 BucketName
  environment:
    Type: String
    Description: The environment name
  app:
    Type: String
    Description: App name used for tagging and naming
  date:
    Type: String
    Description: Date now
  statsInterval:
    # In seconds; how frequently we update our stats for graphs (not for alarms, because reasons)
    # Do not set less than 15 minutes or the graphs get confusing.
    Type: Number
    Default: 900
Resources:
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName:
        Fn::Sub: "${app}-alerts"
      DisplayName: Lone worker alerts
  ConnectFunctionErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: Connect Function Errors
      AlarmDescription: "The ConnectFunction Lambda function has errored."
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: ConnectFunction
      Statistic: Sum
      Period: 900            # Evaluate every 15 minutes
      EvaluationPeriods: 48  # Evaluate over 12 hour window
      DatapointsToAlarm: 1   # Trigger if any single period breaches threshold
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Ref: AlarmTopic
  ConnectFunctionThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: Connect Function Throttles
      AlarmDescription: "The ConnectFunction Lambda function has throttled."
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: ConnectFunction
      Statistic: Sum
      Period: 900            # Evaluate every 15 minutes
      EvaluationPeriods: 48  # Evaluate over 12 hour window
      DatapointsToAlarm: 1   # Trigger if any single period breaches threshold
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Ref: AlarmTopic
  CheckFunctionErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: Check Function Errors
      AlarmDescription: "The CheckFunction Lambda function has errored."
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: CheckFunction
      Statistic: Sum
      Period: 900            # Evaluate every 15 minutes
      EvaluationPeriods: 48  # Evaluate over 12 hour window
      DatapointsToAlarm: 1   # Trigger if any single period breaches threshold
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Ref: AlarmTopic
  CheckFunctionThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: Check Function Throttles
      AlarmDescription: "The CheckFunction Lambda function has throttled."
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: CheckFunction
      Statistic: Sum
      Period: 900            # Evaluate every 15 minutes
      EvaluationPeriods: 48  # Evaluate over 12 hour window
      DatapointsToAlarm: 1   # Trigger if any single period breaches threshold
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Ref: AlarmTopic
  MissedCheckoutsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: Missed Checkouts
      AlarmDescription: "A checkout has been missed."
      Namespace:
        Fn::Sub: "${app}/Check"
      MetricName: CheckoutsMissed
      Statistic: Sum
      Period: 900            # Evaluate every 15 minutes
      EvaluationPeriods: 48  # Evaluate over 12 hour window
      DatapointsToAlarm: 1   # Trigger if any single period breaches threshold
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
  MissedCheckinsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: Missed Checkins
      AlarmDescription: "A checkin has been missed."
      Namespace:
        Fn::Sub: "${app}/Check"
      MetricName: CheckinsMissed
      Statistic: Sum
      Period: 900            # Evaluate every 15 minutes
      EvaluationPeriods: 48  # Evaluate over 12 hour window
      DatapointsToAlarm: 1   # Trigger if any single period breaches threshold
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
  EmergencyCallsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: Emergency Calls
      AlarmDescription: "An emergency call has occurred."
      Namespace:
        Fn::Sub: "${app}/Connect"
      MetricName: Emergencies
      Statistic: Sum
      Period: 900            # Evaluate every 15 minutes
      EvaluationPeriods: 48  # Evaluate over 12 hour window
      DatapointsToAlarm: 1   # Trigger if any single period breaches threshold
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
  ClientSecretExpiringMonthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: Client Secret Expiring Within Month
      AlarmDescription: "The M365 client secret will expire within 30 days. Time to plan a rotation."
      Namespace:
        Fn::Sub: "${app}/Check"
      MetricName: ClientSecretDaysToExpiry
      Statistic: Maximum  # Gauge value; one datapoint per CheckFunction run
      Period: 900
      EvaluationPeriods: 1  # Single period — clears within ~25 minutes once the metric is good
      DatapointsToAlarm: 1
      Threshold: 30
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Ref: AlarmTopic
  ClientSecretExpiringWeekAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: Client Secret Expiring Within Week
      AlarmDescription: "The M365 client secret will expire within 7 days, or has already expired. Rotate now."
      Namespace:
        Fn::Sub: "${app}/Check"
      MetricName: ClientSecretDaysToExpiry
      Statistic: Maximum
      Period: 900
      EvaluationPeriods: 1  # Single period — clears within ~25 minutes once the metric is good
      DatapointsToAlarm: 1
      Threshold: 7
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Ref: AlarmTopic
  ClientSecretExpiryInvalidAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: Client Secret Expiry Invalid
      AlarmDescription: "The M365 client secret expiry parameter is missing, unparseable, or set more than a year ahead. Set clientsecretexpiry to a real ISO 8601 date."
      Namespace:
        Fn::Sub: "${app}/Check"
      MetricName: ClientSecretDaysToExpiry
      Statistic: Maximum
      Period: 900
      EvaluationPeriods: 1  # Single period — clears within ~25 minutes once the metric is good
      DatapointsToAlarm: 1
      Threshold: 366
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Ref: AlarmTopic
  LoneworkerDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName:
        Fn::Sub: "${app}"
      DashboardBody:
        Fn::Sub: |
            {
                "widgets": [
                    {
                        "height": 6,
                        "width": 6,
                        "y": 6,
                        "x": 0,
                        "type": "metric",
                        "properties": {
                            "metrics": [
                                [ "AWS/Lambda", "Invocations", "FunctionName", "CheckFunction", { "region": "${AWS::Region}", "visible": false } ],
                                [ ".", "Errors", ".", ".", { "region": "${AWS::Region}", "visible": false } ],
                                [ "...", "ConnectFunction", { "region": "${AWS::Region}", "color": "#d62728" } ],
                                [ ".", "Invocations", ".", ".", { "region": "${AWS::Region}", "color": "#2ca02c" } ]
                            ],
                            "view": "timeSeries",
                            "stacked": false,
                            "region": "${AWS::Region}",
                            "period": ${statsInterval},
                            "liveData": true,
                            "stat": "Sum",
                            "title": "Connect function invocations and errors"
                        }
                    },
                    {
                        "height": 6,
                        "width": 6,
                        "y": 12,
                        "x": 0,
                        "type": "metric",
                        "properties": {
                            "metrics": [
                                [ "AWS/Lambda", "Invocations", "FunctionName", "CheckFunction", { "region": "${AWS::Region}", "color": "#2ca02c" } ],
                                [ ".", "Errors", ".", ".", { "region": "${AWS::Region}", "color": "#d62728" } ],
                                [ "AWS/Lambda", "Invocations", "FunctionName", "MetricsFunction", { "region": "${AWS::Region}", "color": "#1f77b4" } ],
                                [ ".", "Errors", ".", ".", { "region": "${AWS::Region}", "color": "#ffbb78" } ]
                            ],
                            "view": "timeSeries",
                            "stacked": false,
                            "region": "${AWS::Region}",
                            "title": "Timed function invocations and errors",
                            "period": ${statsInterval},
                            "liveData": true,
                            "stat": "Sum"
                        }
                    },
                    {
                        "height": 6,
                        "width": 6,
                        "y": 6,
                        "x": 6,
                        "type": "metric",
                        "properties": {
                            "metrics": [
                                [ "AWS/Lambda", "Invocations", "FunctionName", "CheckFunction", { "region": "${AWS::Region}", "color": "#2ca02c", "visible": false } ],
                                [ ".", "Errors", ".", ".", { "region": "${AWS::Region}", "color": "#d62728", "visible": false } ],
                                [ "...", "ConnectFunction", { "region": "${AWS::Region}", "color": "#d62728", "visible": false } ],
                                [ ".", "Invocations", ".", ".", { "region": "${AWS::Region}", "color": "#c49c94", "visible": false } ],
                                [ "${app}/Check", "CheckinsMissed", { "region": "${AWS::Region}", "visible": false } ],
                                [ ".", "CheckoutsMissed", { "region": "${AWS::Region}", "visible": false } ],
                                [ ".", "MeetingsChecked", { "region": "${AWS::Region}", "visible": false } ],
                                [ "${app}/Connect", "NoMatchingAppointment", { "region": "${AWS::Region}" } ],
                                [ ".", "Checkins", { "region": "${AWS::Region}" } ],
                                [ ".", "Emergencies", { "region": "${AWS::Region}" } ],
                                [ ".", "Checkouts", { "region": "${AWS::Region}" } ],
                                [ ".", "DuplicateCall", { "region": "${AWS::Region}" } ],
                                [ ".", "Success", { "region": "${AWS::Region}" } ],
                                [ ".", "UnknownCaller", { "region": "${AWS::Region}" } ]
                            ],
                            "view": "timeSeries",
                            "stacked": false,
                            "region": "${AWS::Region}",
                            "title": "Connect function results",
                            "period": ${statsInterval},
                            "liveData": true,
                            "stat": "Sum"
                        }
                    },
                    {
                        "height": 6,
                        "width": 6,
                        "y": 12,
                        "x": 6,
                        "type": "metric",
                        "properties": {
                            "metrics": [
                                [ "AWS/Lambda", "Invocations", "FunctionName", "CheckFunction", { "region": "${AWS::Region}", "color": "#2ca02c", "visible": false } ],
                                [ ".", "Errors", ".", ".", { "region": "${AWS::Region}", "color": "#d62728", "visible": false } ],
                                [ "...", "ConnectFunction", { "region": "${AWS::Region}", "visible": false } ],
                                [ ".", "Invocations", ".", ".", { "region": "${AWS::Region}", "visible": false } ],
                                [ "${app}/Check", "CheckinsMissed", { "region": "${AWS::Region}" } ],
                                [ ".", "CheckoutsMissed", { "region": "${AWS::Region}" } ],
                                [ ".", "MeetingsChecked", { "region": "${AWS::Region}" } ]
                            ],
                            "view": "timeSeries",
                            "stacked": false,
                            "region": "${AWS::Region}",
                            "title": "Check function results",
                            "period": ${statsInterval},
                            "liveData": true,
                            "stat": "Sum"
                        }
                    },
                    {
                        "height": 6,
                        "width": 6,
                        "y": 6,
                        "x": 12,
                        "type": "alarm",
                        "properties": {
                            "title": "Current alarm state",
                            "alarms": [
                                "arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${MissedCheckinsAlarm}",
                                "arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${MissedCheckoutsAlarm}",
                                "arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${EmergencyCallsAlarm}",
                                "arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${ConnectFunctionErrorAlarm}",
                                "arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${ConnectFunctionThrottleAlarm}",
                                "arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${CheckFunctionErrorAlarm}",
                                "arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${CheckFunctionThrottleAlarm}",
                                "arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${ClientSecretExpiringMonthAlarm}",
                                "arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${ClientSecretExpiringWeekAlarm}",
                                "arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${ClientSecretExpiryInvalidAlarm}"
                            ]
                        }
                    },
                    {
                        "height": 3,
                        "width": 18,
                        "y": 0,
                        "x": 0,
                        "type": "metric",
                        "properties": {
                            "metrics": [
                                [ "${app}/Connect", "Emergencies", { "region": "${AWS::Region}", "label": "Emergency calls" } ],
                                [ "${app}/Check", "CheckinsMissed", { "region": "${AWS::Region}", "label": "Checkins missed" } ],
                                [ ".", "CheckoutsMissed", { "region": "${AWS::Region}", "label": "Checkouts missed" } ],
                                [ "AWS/Lambda", "Lambda errors" ],
                                [ ".", "Lambda throttles" ]
                            ],
                            "sparkline": false,
                            "view": "singleValue",
                            "region": "${AWS::Region}",
                            "stat": "Sum",
                            "title": "Missed calls and emergencies",
                            "setPeriodToTimeRange": true,
                            "liveData": true,
                            "trend": false
                        }
                    },
                    {
                        "type": "text",
                        "x": 12,
                        "y": 12,
                        "width": 6,
                        "height": 5,
                        "properties": {
                            "markdown": "This dashboard shows the following.\n\n- Total number of missed calls, emergencies, errors and throttles in the time period covered.\n- Whether there were any alarms (serious errors) in the past 12 hours.\n- Graphs of rates of operations and metrics as counters per ${statsInterval} second period over the period covered.\n\n\nThe dashboard was last updated ${date}.\n"
                        }
                    },
                    {
                        "height": 3,
                        "width": 14,
                        "y": 3,
                        "x": 0,
                        "type": "metric",
                        "properties": {
                            "metrics": [
                                [ "AWS/Lambda", "Invocations", "FunctionName", "ConnectFunction", "Resource", "ConnectFunction", { "region": "${AWS::Region}", "label": "Calls made" } ],
                                [ "${app}/Connect", "Checkins", { "region": "${AWS::Region}" } ],
                                [ "${app}/Connect", "Checkouts", { "region": "${AWS::Region}" } ],
                                [ "${app}/Connect", "Success", { "region": "${AWS::Region}" } ]
                            ],
                            "sparkline": false,
                            "view": "singleValue",
                            "region": "${AWS::Region}",
                            "stat": "Sum",
                            "title": "Routine operations",
                            "setPeriodToTimeRange": true,
                            "liveData": true,
                            "trend": false
                        }
                    },
                    {
                        "height": 3,
                        "width": 4,
                        "y": 3,
                        "x": 14,
                        "type": "metric",
                        "properties": {
                            "metrics": [
                                [ "${app}/Check", "ClientSecretDaysToExpiry", { "region": "${AWS::Region}", "label": "Days until expiry" } ]
                            ],
                            "sparkline": false,
                            "view": "singleValue",
                            "region": "${AWS::Region}",
                            "stat": "Maximum",
                            "title": "Client secret expiry",
                            "period": 900,
                            "setPeriodToTimeRange": false,
                            "liveData": true,
                            "trend": false
                        }
                    }
                ]
            }
